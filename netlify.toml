[build]
command = "npx next build"
publish = ".next"

[[plugins]]
package = "@netlify/plugin-nextjs"

# Force browsers (especially Safari on iPad) to always revalidate HTML pages
# so they pick up new content-hashed JS chunks on every deploy. Stale HTML
# is what keeps an old build alive after a redeploy.
[[headers]]
for = "/*"
[headers.values]
Cache-Control = "no-cache, must-revalidate"

# Content-hashed Next.js assets are safe to cache aggressively — their
# filenames change every build, so a fresh HTML page always points at the
# newest chunks.
[[headers]]
for = "/_next/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
